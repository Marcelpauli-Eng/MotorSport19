spring:
  application:
    name: motorsport19-taller

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/motorsport19}
    username: ${SPRING_DATASOURCE_USERNAME:taller}
    password: ${SPRING_DATASOURCE_PASSWORD:taller}
    hikari:
      pool-name: taller-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. Hibernate solo COMPRUEBA que las entidades
      # coinciden con las tablas; nunca crea ni modifica nada.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Madrid
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Permite desactivar el perfil `demo` sin que Flyway proteste por la
    # migracion de datos de demostracion que ya se aplico.
    ignore-migration-patterns: "*:missing"

  jackson:
    # Los campos vacios se envian como null en vez de omitirse: el frontend
    # recibe siempre la misma forma de objeto, venga la ficha completa o a
    # medias, y los formularios no necesitan tratar claves ausentes.
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.motorsport19.taller: INFO
    org.flywaydb: INFO
