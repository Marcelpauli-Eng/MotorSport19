spring:
  application:
    name: motorsport19-taller

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/motorsport19}
    username: ${SPRING_DATASOURCE_USERNAME:taller}
    password: ${SPRING_DATASOURCE_PASSWORD:taller}
    hikari:
      pool-name: taller-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. Hibernate solo COMPRUEBA que las entidades
      # coinciden con las tablas; nunca crea ni modifica nada.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Madrid
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Permite desactivar el perfil `demo` sin que Flyway proteste por la
    # migracion de datos de demostracion que ya se aplico.
    ignore-migration-patterns: "*:missing"

  jackson:
    # Los campos vacios se envian como null en vez de omitirse: el frontend
    # recibe siempre la misma forma de objeto, venga la ficha completa o a
    # medias, y los formularios no necesitan tratar claves ausentes.
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.motorsport19.taller: INFO
    org.flywaydb: INFO

# ---------------------------------------------------------------------------
# Seguridad
# ---------------------------------------------------------------------------
motorsport19:
  seguridad:
    # Clave con la que se firman los tokens. SIN VALOR POR DEFECTO a proposito:
    # una clave por defecto acaba siempre en produccion, y con ella cualquiera
    # puede fabricarse un token de administrador.
    #
    #   Genérela con:  openssl rand -base64 48
    #   Variable de entorno: MOTORSPORT19_SEGURIDAD_CLAVE_JWT
    clave-jwt: ${MOTORSPORT19_SEGURIDAD_CLAVE_JWT:}

    # Duracion de la sesion. Una jornada de taller.
    duracion-token: PT8H

    # Freno a los intentos de adivinar contrasenas.
    max-intentos-login: 5
    bloqueo-login: PT15M

    # Origenes permitidos para peticiones desde otro dominio, separados por comas.
    # Vacio = ninguno. Con el montaje recomendado (nginx en el taller, proxy en
    # Vercel) no hace falta, porque frontend y API comparten dominio.
    origenes-cors: ${MOTORSPORT19_SEGURIDAD_ORIGENES_CORS:}

  # Primer administrador, solo cuando la base no tiene ningun usuario. Si se deja
  # la contrasena vacia se genera una al azar y se escribe en el log de arranque:
  # asi no hay ninguna contrasena por defecto en el repositorio.
  admin-inicial:
    username: ${MOTORSPORT19_ADMIN_USUARIO:admin}
    password: ${MOTORSPORT19_ADMIN_PASSWORD:}
