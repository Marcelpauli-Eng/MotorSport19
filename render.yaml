# Despliegue del backend en Render.
#
# Render lee este fichero desde la raiz del repositorio (Blueprint) y crea el
# servicio automaticamente. La base de datos NO se crea aqui: vive en Supabase.
#
# Ojo con el plan gratuito: el servicio se duerme tras 15 minutos sin trafico y
# la siguiente peticion tarda ~50 segundos en despertarlo. Para un taller que lo
# usa a diario conviene el plan de pago mas bajo; para ensenarlo, el gratuito
# sobra.
services:
  - type: web
    name: motorsport19-api
    runtime: docker
    # IMPORTANTE: crea el proyecto de Supabase en la MISMA ciudad
    # (eu-central-1, Frankfurt). Cada pantalla hace entre 3 y 10 consultas, y
    # con las dos piezas en la misma region cada una cuesta ~2 ms en vez de
    # ~15 ms. En la pantalla mas pesada eso son 130 ms de diferencia.
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: TZ
        value: Europe/Madrid

      # Estas tres se rellenan a mano en el panel de Render.
      # Usa el POOLER EN MODO SESSION de Supabase (puerto 5432), no la conexion
      # directa (solo IPv6) ni el modo transaction (rompe Flyway).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Origen permitido para CORS: pon aqui la URL de tu frontend en Vercel,
      # por ejemplo https://motorsport19.vercel.app
      #
      # No lo dejes vacio dando por hecho que el proxy de Vercel basta. Un proxy
      # inverso reenvia la cabecera Origin del navegador salvo que se le diga lo
      # contrario, y entonces la API responde 403 a todo, login incluido. Le
      # paso exactamente eso al nginx del taller hasta que se le anadio
      # `proxy_set_header Origin ""`. Sobre Vercel no se puede hacer lo mismo,
      # asi que aqui se declara el origen y se acaba la duda.
      - key: MOTORSPORT19_SEGURIDAD_ORIGENES_CORS
        sync: false

      # Clave con la que se firman los tokens de sesion. La API se niega a
      # arrancar sin ella, y tambien si tiene menos de 32 caracteres.
      #
      # `generateValue` hace que Render genere una al crear el servicio y no la
      # guarda nadie en el repositorio. Cambiarla invalida todas las sesiones
      # abiertas, que es justo lo que se quiere si alguna vez se filtra.
      - key: MOTORSPORT19_SEGURIDAD_CLAVE_JWT
        generateValue: true
