# El reproductor de camaras negocia por WebSocket, y una conexion asi solo se
# establece si la cabecera `Connection` viaja intacta. En el resto de peticiones
# tiene que ir vacia, de ahi el mapa en vez de un valor fijo.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular: cualquier ruta desconocida devuelve el index (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia la API. Para el navegador esto es el mismo origen: la pagina y
    # /api cuelgan del mismo dominio y puerto, asi que CORS no entra en juego.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La cabecera Origin se borra a proposito.
        #
        # El navegador la envia en los POST aunque sean del mismo origen, y
        # nginx la reenviaria tal cual. La API, que no tiene ningun origen
        # permitido, la leeria como una peticion de fuera y respondería 403 a
        # todo: el login incluido. Sin ella, la peticion llega como lo que
        # realmente es, del propio servidor.
        #
        # No se pierde ninguna proteccion: la sesion viaja en una cabecera
        # Authorization que el navegador no adjunta solo, de modo que una pagina
        # ajena no puede usarla aunque provoque la peticion.
        proxy_set_header Origin            "";

        proxy_read_timeout 120s;
    }

    # Camaras. Detras hay un go2rtc que lee el RTSP de cada Tapo y lo sirve en
    # algo que el navegador sepa reproducir.
    #
    # El `^~` no es decorativo: sin el, el bloque de mas abajo que cachea los
    # `.js` se lleva `/camaras-api/video-rtc.js`, porque en nginx una location
    # con expresion regular gana a una de prefijo. El reproductor se buscaria
    # entre los ficheros estaticos, no existiria, y no se veria ninguna camara.
    location ^~ /camaras-api/ {
        # El nombre se resuelve en cada peticion, no al arrancar, y por eso se
        # pasa por una variable. Escrito literal (`proxy_pass http://camaras:1984`)
        # nginx intenta resolverlo al iniciarse y, si el servicio de camaras no
        # esta levantado (que es lo normal: va en un perfil aparte), se niega a
        # arrancar y tumba TODA la web por unas camaras que igual no existen.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $camaras camaras:1984;

        rewrite ^/camaras-api/(.*)$ /$1 break;
        proxy_pass http://$camaras;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;
        proxy_set_header Host       $host;

        # Un video no termina nunca: es un flujo abierto. Con el buffer puesto
        # nginx lo va acumulando y la imagen llega a tirones y con retardo.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # El reproductor de camaras es de los pocos ficheros nuestros que NO lleva
    # hash en el nombre, asi que no puede caer en la regla de un ano de aqui
    # abajo: una correccion tardaria doce meses en llegar a un navegador que ya
    # lo tuviera guardado. La coincidencia exacta (`=`) gana a la expresion
    # regular, de modo que basta con nombrarlo antes.
    location = /camara-video.js {
        # Una sola cabecera: `expires` emite su propio Cache-Control y, junto a
        # un `add_header`, salian las dos y no esta definido cual gana.
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Los ficheros con hash en el nombre se pueden cachear indefinidamente.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
