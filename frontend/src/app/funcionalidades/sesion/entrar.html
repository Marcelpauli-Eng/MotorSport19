<div class="entrada">
  <form class="entrada__caja" (ngSubmit)="entrar()">
    <div class="entrada__marca" style="display: flex; justify-content: center; margin-bottom: 24px;">
      <img src="/assets/logo-derecha.png" alt="19 Racing Motorsport" style="height: 60px; width: auto; object-fit: contain;" />
    </div>

    @if (error(); as mensaje) {
      <p class="entrada__error" role="alert">{{ mensaje }}</p>
    }

    <div class="campo">
      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        [disabled]="enviando()"
        autofocus
      />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="enviando()"
      />
    </div>

    <button type="submit" class="boton boton--principal entrada__enviar" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
