<app-dialogo
  titulo="Enviar presupuesto"
  [subtitulo]="presupuesto().clienteNombre + ' · ' + presupuesto().descripcionMoto"
  (cerrar)="cerrar.emit()"
>
  <div class="campo">
    <label for="presupuestoMensaje">
      Mensaje al cliente <span class="silenciado">(en {{ idioma() }}, como escribió en la web)</span>
    </label>
    <textarea
      id="presupuestoMensaje"
      rows="12"
      [ngModel]="mensaje()"
      (ngModelChange)="retocar($event)"
    ></textarea>
    <span class="pequeno silenciado">
      Se abre tu WhatsApp o tu correo con este texto; puedes retocarlo antes de enviarlo. El PDF no
      se adjunta solo: descárgalo y adjúntalo en la conversación.
    </span>
  </div>

  <ng-container pie>
    <button type="button" class="boton" (click)="descargarPdf()">
      <app-icono nombre="descargar" [tamano]="16" /> PDF
    </button>
    <button
      type="button"
      class="boton"
      [disabled]="!puedeEnviar() || !presupuesto().clienteEmail"
      [title]="presupuesto().clienteEmail ? '' : 'El cliente no dejó email'"
      (click)="enviar('EMAIL')"
    >
      Enviar por email
    </button>
    <button type="button" class="boton boton--principal" [disabled]="!puedeEnviar()" (click)="enviar('WHATSAPP')">
      <app-icono nombre="whatsapp" [tamano]="16" /> Enviar por WhatsApp
    </button>
  </ng-container>
</app-dialogo>
