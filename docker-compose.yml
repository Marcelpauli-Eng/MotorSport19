# Pila completa en local (base de datos incluida).
# Si la base de datos esta en Supabase, usa docker-compose.supabase.yml.
services:

  db:
    # Se fija la 17 para igualar la version que corre Supabase: probar contra
    # una version distinta de la de produccion es pedir sorpresas.
    image: postgres:17-alpine
    container_name: motorsport19-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motorsport19}
      POSTGRES_USER: ${POSTGRES_USER:-taller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taller}
      TZ: ${TZ:-Europe/Madrid}
      PGTZ: ${TZ:-Europe/Madrid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # La API no arranca hasta que Postgres acepta conexiones de verdad.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taller} -d ${POSTGRES_DB:-motorsport19}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - motorsport19

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motorsport19-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-motorsport19}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-taller}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-taller}

      # Clave de firma de las sesiones. Aqui lleva un valor por defecto, igual
      # que la contrasena de la base: esta pila es para tu maquina. Fuera de
      # local hay que darla de verdad, y la API se niega a arrancar sin ella.
      MOTORSPORT19_SEGURIDAD_CLAVE_JWT: ${CLAVE_JWT:-clave-solo-para-desarrollo-local-no-usar-fuera-1234}

      # Se permite el `ng serve` de Angular. Al servir el frontend desde el
      # contenedor `web` esto no hace falta, porque su nginx borra la cabecera
      # Origin; pero desarrollando con `npm start` la peticion sale del 4200 y
      # llega con Origin, y sin este permiso la API responde 403 hasta al login.
      MOTORSPORT19_SEGURIDAD_ORIGENES_CORS: ${CORS_ORIGENES:-http://localhost:4200,http://127.0.0.1:4200}

      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - motorsport19

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motorsport19-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${WEB_PORT:-4200}:80"
    networks:
      - motorsport19

  # Camaras del taller. Lee el RTSP de cada camara y lo reparte al navegador,
  # que no sabe reproducir RTSP por su cuenta.
  #
  # Va en un perfil aparte: sin `--profile camaras` este servicio ni se levanta,
  # asi que quien no tenga camaras sigue arrancando la pila como siempre.
  #
  #   cp infra/camaras/go2rtc.example.yaml infra/camaras/go2rtc.yaml
  #   docker compose --profile camaras up -d
  camaras:
    image: alexxit/go2rtc:1.9.14
    container_name: motorsport19-camaras
    profiles: ["camaras"]
    restart: unless-stopped
    volumes:
      - ./infra/camaras/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      # WebRTC necesita conexion directa con el navegador, asi que este si se
      # abre a la red.
      - "${WEBRTC_PORT:-8555}:8555/tcp"
      - "${WEBRTC_PORT:-8555}:8555/udp"

      # La API de las camaras, en cambio, se ata al `127.0.0.1` del equipo: la
      # alcanza el propio ordenador y nadie mas. Abierta a la red del taller,
      # cualquiera con la IP entraria directo a las camaras. Al programa le da
      # igual: el nginx del contenedor `web` habla con go2rtc por dentro de la
      # red de Docker. Se publica solo para poder desarrollar con `npm start`.
      #
      # OJO, y esta escrito tal cual en el README: la ruta /camaras-api/ que
      # publica ese nginx NO pide sesion. El menu de camaras se le esconde a
      # quien no es de direccion, pero quien conozca la ruta ve el video sin
      # entrar en el programa. Mientras esto no se cierre, el acceso desde
      # fuera va con Cloudflare Access o Tailscale delante, no a pelo.
      - "127.0.0.1:${CAMARAS_PORT:-1984}:1984"
    environment:
      TZ: ${TZ:-Europe/Madrid}
    networks:
      - motorsport19

volumes:
  db_data:
    name: motorsport19_db_data

networks:
  motorsport19:
    name: motorsport19
