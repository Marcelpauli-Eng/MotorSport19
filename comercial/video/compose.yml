# Pila de demostración aislada para grabar el vídeo: volumen propio, datos demo, sin tocar motorsport19_db_data.
name: ms19video
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: demo, POSTGRES_USER: taller, POSTGRES_PASSWORD: taller, TZ: Europe/Madrid, PGTZ: Europe/Madrid }
    volumes: [ "dbvideo:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U taller -d demo"], interval: 5s, retries: 20 }
  api:
    build: ../../backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/demo
      SPRING_DATASOURCE_USERNAME: taller
      SPRING_DATASOURCE_PASSWORD: taller
      MOTORSPORT19_SEGURIDAD_CLAVE_JWT: clave-solo-para-el-video-de-demostracion-1234
      TZ: Europe/Madrid
  web:
    build: ../../frontend
    depends_on: [ api ]
    ports: [ "4340:80" ]
volumes:
  dbvideo:
